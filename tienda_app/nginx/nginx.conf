# Servicios backend definidos en docker-compose.yml.
upstream django_backend {
    server web_django:8000;
}

upstream flask_backend {
    server pagos_flask:5000;
}

server {
    listen 80;

    # La API v1 continúa siendo atendida por Django.
    location /api/v1/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La compra de la API v2 se delega al microservicio Flask.
    location /api/v2/comprar {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}