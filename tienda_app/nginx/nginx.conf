# Servicios backend definidos en docker-compose.yml.
log_format upstream_route '$remote_addr [$time_local] "$request" '
                          'status=$status proxy_host=$proxy_host '
                          'upstream=$upstream_addr upstream_status=$upstream_status';
access_log /dev/stdout upstream_route;
error_log /dev/stderr info;

upstream django_backend {
    server web_django:8000;
}

upstream flask_backend {
    server pagos_flask:5000;
}

server {
    listen 80;

    # Normaliza la URL del panel de administración de Django.
    location = /admin {
        return 301 /admin/;
    }

    # El panel de administración es servido por Django.
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La API v1 continúa siendo atendida por Django.
    location /api/v1/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La compra de la API v2 se delega al microservicio Flask.
    location /api/v2/comprar {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}