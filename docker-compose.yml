
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tienda_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web_django:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: tienda_db
      DB_USER: postgres
      DB_PASSWORD: secret_password
      DB_HOST: db
      DB_PORT: "5432"

  pagos_flask:
    build:
      context: ./microservicio_pagos
      dockerfile: Dockerfile
    expose:
      - "5000"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./tienda_app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_django
      - pagos_flask

volumes:
  postgres_data:
